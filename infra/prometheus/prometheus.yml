global:
  scrape_interval: 15s

scrape_configs:
  - job_name: aurora-gateway
    static_configs:
      - targets: ["host.docker.internal:2112"]

  - job_name: aurora-ingestion
    static_configs:
      - targets: ["host.docker.internal:2113"]

  - job_name: aurora-engine
    static_configs:
      - targets: ["host.docker.internal:2114"]
