name: Engineering verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - run: npm run validate:mission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r scripts/validation-requirements.txt
      - run: python scripts/validate-dynamics.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-evidence
          path: |
            frontend/test-results
            docs/generated
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test ./gateway -run '^$' -bench BenchmarkBroadcast -benchmem
        working-directory: backend
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path backend/engine-rust/Cargo.toml --locked
      - run: cargo fmt --manifest-path backend/engine-rust/Cargo.toml --check
